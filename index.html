<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1D4ED8"><title>D-CHA GYM</title>
<link rel="stylesheet" href="style.css"><link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script><script src="app.js"></script></head>
<body><main class="wrap"><div class="brand">D-CHA GYM</div>
<div class="card"><img src="icons/icon-192.png" width="96" height="96" alt="Logo D-CHA GYM"><div class="nama">Status sistem</div>
<p class="muted" id="s">Memeriksa koneksi...</p><button id="u" hidden>Periksa lagi</button></div></main>
<script>
function cek(){var s=document.getElementById('s'),u=document.getElementById('u');s.textContent='Memeriksa koneksi...';u.hidden=true;
ping().then(function(r){s.textContent=r.ok?'Server tersambung: '+r.gym:'Server menjawab, tetapi ada masalah.';u.hidden=false;})
.catch(function(){s.textContent='Server tidak dapat dihubungi. Periksa alamat web app di config.js dan sinyal internet.';u.hidden=false;});}
document.getElementById('u').onclick=cek;cek();
</script><script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script></body></html>
