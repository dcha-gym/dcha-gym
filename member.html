<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8"><title>Kartu Member</title>
<link rel="stylesheet" href="style.css"><link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D-CHA GYM">
<script src="config.js"></script><script src="qrcode.js"></script><script src="app.js"></script></head>
<body><main class="wrap">
<div class="brand" id="gym">D-CHA GYM</div>
<section class="card" id="kartu" hidden>
<div class="avatar" id="av"></div>
<div><div class="nama" id="nama"></div><p class="muted" id="id"></p></div>
<div class="chip" id="chip"></div>
<div class="qr" id="qr" role="img" aria-label="QR code member" hidden></div>
<div class="peringatan" id="warn" hidden></div>
<div class="tgl" id="tgl"></div>
</section>
<p class="muted" id="pesan">Memuat kartu...</p>
<details class="pasang"><summary>Pasang di layar utama HP</summary>
<p><b>iPhone (Safari):</b> ketuk tombol Bagikan, pilih Tambah ke Layar Utama.</p>
<p><b>Android (Chrome):</b> ketuk menu titik tiga, pilih Instal aplikasi atau Tambahkan ke layar utama.</p>
<button id="pasangBtn" hidden>Pasang sekarang</button></details>
</main>
<script>
(function () {
  var K = 'dcha_member', $ = function (i) { return document.getElementById(i); }, tok = (location.hash || '').slice(1);
  try { if (tok) localStorage.setItem(K + '_t', tok); else tok = localStorage.getItem(K + '_t') || ''; } catch (e) { }
  // Manifest dinamis: ikon di layar utama membawa link pribadi member
  var base = location.href.split('#')[0], dir = base.replace(/[^\/]*$/, '');
  var mf = { name: 'D-CHA GYM', short_name: 'D-CHA GYM', start_url: base + (tok ? '#' + tok : ''), scope: dir, display: 'standalone', background_color: '#F5F7FB', theme_color: '#1D4ED8',
    icons: [{ src: dir + 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }, { src: dir + 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }, { src: dir + 'icons/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
  var l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' })); document.head.appendChild(l);
  var tunda; window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); tunda = e; $('pasangBtn').hidden = false; });
  $('pasangBtn').onclick = function () { if (tunda) tunda.prompt(); };

  function tampil(d, offline) {
    $('gym').textContent = d.gym || CFG.NAMA;
    var aktif = d.tglHabis && d.tglHabis > hariIni() && (offline ? true : d.aktif);
    $('kartu').hidden = false; $('pesan').textContent = '';
    $('nama').textContent = d.nama; $('id').textContent = 'ID ' + d.id;
    $('av').textContent = String(d.nama).split(/\s+/).slice(0, 2).map(function (x) { return x.charAt(0); }).join('').toUpperCase();
    var chip = $('chip'); chip.textContent = aktif ? 'Member aktif' : 'Masa aktif habis'; chip.className = 'chip' + (aktif ? '' : ' habis');
    var qr = $('qr'); qr.hidden = !(aktif && d.kodeQr); qr.innerHTML = '';
    if (!qr.hidden) { var q = qrcode(0, 'M'); q.addData(d.kodeQr); q.make(); qr.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
    var sisa = d.tglHabis ? Math.round((new Date(d.tglHabis + 'T00:00:00') - new Date(hariIni() + 'T00:00:00')) / 86400000) : 0;
    var w = $('warn'); w.hidden = !(aktif && sisa <= 7); w.textContent = 'Masa aktif tinggal ' + sisa + ' hari. Segera perpanjang di kasir.';
    $('tgl').textContent = aktif ? 'Berlaku sampai ' + fmtTgl(d.tglHabis) : 'Berakhir ' + fmtTgl(d.tglHabis) + '. Bayar di kasir untuk mengaktifkan lagi.';
    if (offline) $('pesan').textContent = 'Tanpa internet. Menampilkan kartu tersimpan.';
  }
  var cache = null; try { cache = JSON.parse(localStorage.getItem(K + '_d') || 'null'); } catch (e) { }
  if (!tok) { $('pesan').textContent = 'Buka kartu lewat link pribadi dari admin gym.'; return; }
  if (cache) tampil(cache, true);
  api({ aksi: 'kartu', mt: tok }).then(function (r) {
    if (r.ok) { try { localStorage.setItem(K + '_d', JSON.stringify(r)); } catch (e) { } tampil(r, false); }
    else { try { localStorage.removeItem(K + '_d'); } catch (e) { } $('kartu').hidden = true; $('pesan').textContent = r.pesan || 'Kartu tidak dapat dibuka.'; }
  }).catch(function () { if (!cache) $('pesan').textContent = 'Tidak ada koneksi internet. Coba lagi.'; });
})();
</script></body></html>
